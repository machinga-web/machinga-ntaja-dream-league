<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MNDL MUSIC LYRICS 👑</title><style>*{margin:0;padding:0;box-sizing:border-box}body{background:#000;color:#fff;font-family:Arial;text-align:center;padding:10px}.top{background:#111;padding:12px;border:2px solid #FFD60A;border-radius:15px}.top h1{color:#FFD60A;font-size:16px}.box{background:#111;border:1px solid #222;border-radius:12px;padding:10px;margin:8px 0}.up{background:#FFD60A;color:#000;padding:12px;border-radius:25px;font-weight:bold;display:block;margin:5px 0}.inp{width:100%;padding:10px;border-radius:10px;border:1px solid #333;background:#1a1a1a;color:#fff;margin:5px 0}#preview{width:100%;max-width:380px;height:580px;margin:10px auto;background:#000;border-radius:20px;position:relative;overflow:hidden;background-size:cover;background-position:center}#card{position:absolute;bottom:10px;left:10px;right:10px;background:rgba(0,0,0,0.8);border-radius:15px;padding:12px;border:1px solid #FFD60A44}.main{color:#FFD60A;font-size:22px;font-weight:bold;font-style:italic;text-shadow:0 0 10px #FFD60A}.btn{background:#FFD60A;color:#000;padding:12px;border-radius:25px;border:none;font-weight:bold;width:95%;margin:5px}audio{width:100%;margin:5px 0}</style></head><body><div class="top"><h1>🎵📸 MNDL MUSIC + PICTURE + LYRICS 👑</h1></div><div class="box"><label class="up" for="pic">📸 PICTURE</label><input type="file" id="pic" accept="image/*" hidden><label class="up" for="aud" style="background:#fff;">🎵 SANKHANI NYIMBO (MP3)</label><input type="file" id="aud" accept="audio/*" hidden><textarea id="lyrics" class="inp" placeholder="Lembani mawu a nyimbo...&#10;Mwachitsanzo:&#10;Machinga Ntaja Dream League&#10;Victor Edward BOSS"></textarea><audio id="player" controls></audio></div><div id="preview"><div id="ph" style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:#555;">Picture + Music</div><div id="card"><div style="color:#FFD60A;font-size:10px;">♪ now playing ♪</div><div class="main" id="txt">Machinga Ntaja Dream League</div></div></div><button class="btn" onclick="playBoth()">▶️ SEWERA NYIMBO + LYRICS</button><button class="btn" style="background:#222;color:#fff;" onclick="downloadVideo()">📥 DOWNLOAD PICTURE</button><script>let imgSrc='',audioSrc='';pic.onchange=e=>{let f=e.target.files[0];let r=new FileReader();r.onload=ev=>{imgSrc=ev.target.result;preview.style.backgroundImage=`url(${imgSrc})`;document.getElementById('ph').style.display='none'};r.readAsDataURL(f)};aud.onchange=e=>{let f=e.target.files[0];audioSrc=URL.createObjectURL(f);player.src=audioSrc;};function playBoth(){txt.innerText=lyrics.value||"Machinga Ntaja Dream League";if(audioSrc)player.play();}lyrics.oninput=()=>{txt.innerText=lyrics.value};function downloadVideo(){if(!imgSrc)return alert('Sankhani picture!');let c=document.createElement('canvas');c.width=1080;c.height=1920;let ctx=c.getContext('2d');let img=new Image();img.onload=()=>{ctx.drawImage(img,0,0,1080,1920);ctx.fillStyle='rgba(0,0,0,0.6)';ctx.fillRect(0,1300,1080,620);ctx.fillStyle='#FFD60A';ctx.font='bold italic 60px Arial';ctx.textAlign='center';let lines=lyrics.value.split('\n');let y=1400;lines.forEach(l=>{ctx.fillText(l,540,y);y+=80});let a=document.createElement('a');a.download='MNDL-MUSIC-'+Date.now()+'.jpg';a.href=c.toDataURL();a.click()};img.src=imgSrc}</script></body></html>
