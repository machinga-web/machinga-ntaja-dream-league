<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MNDL PICTURE LYRICS 👑</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0a;color:#fff;font-family:Arial;text-align:center;padding:10px}
.top{background:#000;padding:15px;border:2px solid #FFD60A;border-radius:15px;margin-bottom:10px}
.top h1{color:#FFD60A;font-size:18px}
.box{background:#111;border:1px solid #222;border-radius:15px;padding:12px;margin:10px 0}
.upload{background:#FFD60A;color:#000;padding:14px;border-radius:25px;font-weight:bold;display:block}
.inp{width:100%;padding:12px;border-radius:10px;border:1px solid #333;background:#1a1a1a;color:#fff;margin:6px 0;text-align:center}
textarea.inp{text-align:left;height:80px}
#preview{width:100%;max-width:380px;height:600px;margin:12px auto;background:#000;border-radius:25px;position:relative;overflow:hidden;background-size:cover;background-position:center;box-shadow:0 10px 30px rgba(0,0,0,0.8)}
#preview.ph{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:#555}
.lyricsCard{position:absolute;bottom:12px;left:12px;right:12px;background:rgba(15,15,15,0.85);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,0.1);border-radius:20px;padding:18px 12px 12px;text-align:center}
.lyricsCard.small{color:#FFD60A;font-size:12px;letter-spacing:1px;margin-bottom:8px}
.lyricsCard.main{color:#ffe77a;font-size:26px;font-weight:800;font-style:italic;text-shadow:0 0 15px #FFD60A, 2px 2px 4px #000;line-height:1.1;word-wrap:break-word;font-family:cursive}
.btn{background:#FFD60A;color:#000;padding:14px;border-radius:25px;border:none;font-weight:bold;width:95%;margin:6px;font-size:15px}
.btn2{background:#222;color:#fff}
</style></head><body>
<div class="top"><h1>📸 MNDL LYRICS CARD 👑</h1><p style="color:#666;font-size:10px;">Monga chithunzi chija BOSS VICTOR</p></div>
<div class="box"><label class="upload" for="picInput">📸 SANKHANI PICTURE YANU</label><input type="file" id="picInput" accept="image/*" hidden>
<textarea id="lyricsIn" class="inp" placeholder="Lembani mawu apa...
Mwachitsanzo:
Machinga Ntaja
Dream League - Victor Edward
BOSS"></textarea>
<select id="fontColor" class="inp"><option value="#ffe77a">Yellow Neon - Monga Chithunzi</option><option value="#ffffff">White Neon</option><option value="#ff6b6b">Red Neon</option><option value="#6bff8a">Green Neon</option></select></div>
<div id="preview"><div class="ph">Picture yanu</div><div class="lyricsCard" id="card"><div class="small">now playing • Lyrics •</div><div class="main" id="textOnPic">Machinga Ntaja
Dream League - Victor Edward
BOSS</div><div style="display:flex;justify-content:space-between;margin-top:10px;color:#fff;font-size:14px"><span>♫</span><span>♫</span></div></div></div>
<button class="btn" onclick="download()">📥 DOWNLOAD NGATI CHIYEMBEKEZO CHIJA</button>
<button class="btn btn2" onclick="location.reload()">🔄 Pangani Yatsopano</button>
<canvas id="canvas" style="display:none;"></canvas>
<script>
let imgSrc='';const picInput=document.getElementById('picInput'),preview=document.getElementById('preview'),textOnPic=document.getElementById('textOnPic'),lyricsIn=document.getElementById('lyricsIn');
picInput.onchange=e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=ev=>{imgSrc=ev.target.result;preview.style.backgroundImage=`url(${imgSrc})`;preview.querySelector('.ph').style.display='none'};r.readAsDataURL(f)};
function update(){textOnPic.innerText=lyricsIn.value||"Machinga Ntaja\nDream League - Victor Edward\nBOSS";textOnPic.style.color=document.getElementById('fontColor').value}lyricsIn.oninput=update;fontColor.onchange=update;
function download(){if(!imgSrc)return alert('Sankhani picture kaye BOSS! 📸');let c=document.getElementById('canvas'),ctx=c.getContext('2d'),img=new Image();img.onload=()=>{c.width=1080;c.height=1920;ctx.drawImage(img,0,0,1080,1920);ctx.fillStyle='rgba(10,10,10,0.3)';ctx.fillRect(0,0,1080,1920);let cardH=520,cardY=1920-cardH-30;ctx.fillStyle='rgba(15,15,15,0.88)';ctx.beginPath();ctx.roundRect(30,cardY,1020,cardH,40);ctx.fill();ctx.strokeStyle='rgba(255,255,255,0.1)';ctx.lineWidth=2;ctx.stroke();ctx.fillStyle='#FFD60A';ctx.font='18px Arial';ctx.textAlign='center';ctx.fillText('now playing • Lyrics •',540,cardY+50);ctx.fillStyle=document.getElementById('fontColor').value;ctx.shadowColor=document.getElementById('fontColor').value;ctx.shadowBlur=20;let lines=(lyricsIn.value||"Machinga Ntaja\nDream League - Victor Edward\nBOSS").split('\n');ctx.font='bold italic 78px cursive';let y=cardY+150;lines.forEach(line=>{ctx.fillText(line.trim(),540,y);y+=95});ctx.shadowBlur=0;ctx.fillStyle='#fff';ctx.font='28px Arial';ctx.fillText('♫',80,y+20);ctx.fillText('♫',1000,y+20);let a=document.createElement('a');a.download='MNDL-CARD-'+Date.now()+'.jpg';a.href=c.toDataURL('image/jpeg',0.95);a.click();alert('ZASUNGIDWA BOSS! 👑 Monga chithunzi chija!')};img.src=imgSrc}
</script></body></html>
