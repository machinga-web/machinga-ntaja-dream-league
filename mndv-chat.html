<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VICTOR EDWARD CHAT</title>
<style>*{margin:0;padding:0;box-sizing:border-box}body{background:#111;height:100vh;display:flex;flex-direction:column;font-family:Arial}.top{background:#000;padding:12px;display:flex;gap:10px;border-bottom:3px solid #FFD60A}.logo{width:40px;height:40px;background:#FFD60A;border-radius:50%;display:flex;align-items:center;justify-content:center}.top h2{color:#FFD60A;font-size:16px}.login{flex:1;display:flex;justify-content:center;align-items:center;padding:20px}.box{background:#000;border:2px solid #FFD60A;padding:25px;border-radius:15px;width:90%;max-width:340px;text-align:center}.box h1{color:#FFD60A;font-size:20px}.box input{width:100%;padding:14px;border-radius:25px;border:2px solid #333;background:#111;color:#fff;margin:10px 0;text-align:center}.btn{background:#FFD60A;color:#000;border:none;padding:14px;width:100%;border-radius:25px;font-weight:bold}.chat{display:none;flex:1;flex-direction:column}.msgs{flex:1;overflow:auto;padding:10px;background:#0b141a}.bubble{max-width:75%;padding:8px 12px;border-radius:12px;margin:6px 0;font-size:14px}.other{background:#202c33;color:#fff}.me{background:#FFD60A;color:#000;margin-left:auto}.bar{background:#000;padding:10px;display:flex;gap:8px;border-top:2px solid #FFD60A}.bar input{flex:1;padding:12px;border-radius:25px;border:2px solid #333;background:#111;color:#fff}.send{background:#FFD60A;width:45px;height:45px;border-radius:50%;border:none}</style>
</head><body>
<div class="top"><div class="logo">👑</div><div><h2>VICTOR EDWARD CHAT</h2><p style="color:#888;font-size:11px">Machinga Ntaja</p></div></div>
<div id="login" class="login"><div class="box"><h1>👑 VICTOR EDWARD CHAT</h1><input id="userName" placeholder="Dzina Lanu"><button class="btn" onclick="joinChat()">LOWANI</button></div></div>
<div id="chat" class="chat"><div class="msgs" id="msgs"></div><div class="bar"><input id="msgIn" placeholder="Lembani..."><button class="send" onclick="sendMsg()">➤</button></div></div>
<script>
let myName="",topic="victor-edward-chat-2026",lastId="";
function joinChat(){let n=userName.value.trim();if(!n)return alert("Dzina!");myName=n;login.style.display='none';chat.style.display='flex';addMsg("BOT","Takulandirani BOSS "+myName+"!");listen();setInterval(listen,2500)}
function addMsg(n,t){let b=msgs;let d=document.createElement('div');d.className='bubble '+(n===myName?'me':'other');d.innerHTML=(n!==myName?'<b style=color:#FFD60A;font-size:11px>'+n+'</b><br>':'')+t;b.appendChild(d);b.scrollTop=9999}
async function sendMsg(){let v=msgIn.value.trim();if(!v)return;await fetch('https://ntfy.sh/'+topic,{method:'POST',body:JSON.stringify({name:myName,text:v})});addMsg(myName,v);msgIn.value=""}
async function listen(){try{let r=await fetch('https://ntfy.sh/'+topic+'/json?poll=1');let t=await r.text();for(let l of t.split('\n')){try{let j=JSON.parse(l);if(!j.message)continue;if(j.id===lastId)continue;let inn=JSON.parse(j.message);if(inn.name===myName)continue;lastId=j.id;addMsg(inn.name,inn.text)}catch(e){}}}catch(e){}}
</script></body></html>
