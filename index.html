<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MNDL - VICTOR EDWARD EDITION 👑</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0a;color:#FFD60A;font-family:Arial;text-align:center;padding:10px}
.header{background:#000;border:3px solid #FFD60A;border-radius:15px;padding:15px;margin-bottom:10px}
.header h1{font-size:22px;color:#FFD60A}
.header p{font-size:12px;color:#fff;margin-top:5px}
.team{background:#1a1a1a;border:2px solid #333;border-radius:10px;padding:10px;margin:5px 0;display:flex;justify-content:space-between}
.team.top{border-color:#FFD60A;background:#222;box-shadow:0 0 10px #FFD60A}
.table-box{background:#111;border:2px solid #FFD60A;border-radius:10px;padding:10px;margin:10px 0;overflow-x:auto}
table{width:100%;border-collapse:collapse;color:#fff;font-size:13px}
th{background:#FFD60A;color:#000;padding:8px}
td{padding:6px;border-bottom:1px solid #333}
.top-team{background:#222;color:#FFD60A;font-weight:bold}
.fixtures{background:#111;border:2px solid #333;border-radius:10px;padding:10px;margin:10px 0}
.match{background:#1a1a1a;border-radius:8px;padding:8px;margin:5px 0;display:flex;justify-content:space-between;align-items:center;font-size:12px}
.btn{background:#FFD60A;color:#000;border:none;padding:10px 20px;border-radius:20px;font-weight:bold;margin:5px;cursor:pointer}
.btn-play{background:#00ff00}
.footer{margin-top:15px;font-size:10px;color:#888}
</style>
</head>
<body>
<div class="header">
<h1>👑 MNDL - VICTOR EDWARD EDITION 👑</h1>
<p>💛 MACHINGA NTAJA DREAM LEAGUE - BOSS VICTOR 💛</p>
<p>Kill Me Or You KILLED - MY TEAM - CHAMPION!</p>
</div>

<div id="teams"></div>

<div class="table-box">
<h3 style="color:#FFD60A;margin-bottom:10px">🏆 TABLE - AMENE ALI NDI POINTS AMBIRI #1 🏆</h3>
<table>
<thead><tr><th>#</th><th>Team</th><th>P</th><th>W</th><th>D</th><th>L</th><th>Pts</th></tr></thead>
<tbody id="table"></tbody>
</table>
</div>

<div class="fixtures">
<h3 style="color:#FFD60A;margin-bottom:10px">⚽ FIXTURES - DAY 1 mpaka DAY 6 ⚽</h3>
<div id="fixtures"></div>
<button class="btn btn-play" onclick="playAll()">▶️ SEWERANI DAY YONSE</button>
<button class="btn" onclick="resetLeague()">🔄 YAMBANSO</button>
</div>

<div class="footer">👑 BOSS VICTOR EDWARD - MNDL 2025 - MACHINGA NTAJA 👑</div>

<script>
let teams=[
{name:"Kill Me Or You KILLED - VICTOR EDWARD",p:0,w:0,d:0,l:0,pts:0},
{name:"Night Plus Champion",p:0,w:0,d:0,l:0,pts:0},
{name:"TBO City FC",p:0,w:0,d:0,l:0,pts:0},
{name:"Umbwa City FC",p:0,w:0,d:0,l:0,pts:0}
];

let fixtures=[
[0,1],[2,3],[0,2],[1,3],[0,3],[1,2],
[1,0],[3,2],[2,0],[3,1],[3,0],[2,1]
];

let currentDay=0;

function render(){
  document.getElementById('teams').innerHTML=teams.map(t=>{
    let isKill=t.name.includes("KILL");
    return `<div class="team ${isKill?'top':''}"><span>${isKill?'👑 ': '⚽ '}${t.name}</span><span>${t.pts} PTS</span></div>`
  }).join('');

  let sorted=[...teams].sort((a,b)=> b.pts - a.pts);
  document.getElementById('table').innerHTML=sorted.map((t,i)=>{
    let isKill=t.name.includes("KILL");
    let crown=i===0?"👑":"";
    let nameDisplay=isKill?t.name+" - BOSS":t.name;
    return `<tr class="${i===0?'top-team':''}"><td>${crown}${i+1}</td><td style="text-align:left">${nameDisplay}</td><td>${t.p}</td><td>${t.w}</td><td>${t.d}</td><td>${t.l}</td><td><b>${t.pts}</b></td></tr>`
  }).join('');

  document.getElementById('fixtures').innerHTML=fixtures.map((f,i)=>{
    let day=Math.floor(i/2)+1;
    let t1=teams[f[0]].name.split(" - ")[0];
    let t2=teams[f[1]].name.split(" - ")[0];
    let played=i<currentDay?"✅":"⏳";
    return `<div class="match"><span>Day ${day}: ${t1} vs ${t2}</span><span>${played}</span></div>`
  }).join('');
}

function playAll(){
  if(currentDay>=fixtures.length){alert("League Yatha! 👑");return;}
  let f=fixtures[currentDay];
  let g1=Math.floor(Math.random()*4);
  let g2=Math.floor(Math.random()*4);
  if(g1===g2){g1+=1;}
  teams[f[0]].p++;teams[f[1]].p++;
  if(g1>g2){teams[f[0]].w++;teams[f[0]].pts+=3;teams[f[1]].l++;}
  else if(g2>g1){teams[f[1]].w++;teams[f[1]].pts+=3;teams[f[0]].l++;}
  else{teams[f[0]].d++;teams[f[1]].d++;teams[f[0]].pts+=1;teams[f[1]].pts+=1;}
  currentDay++;
  render();
}

function resetLeague(){
  teams.forEach(t=>{t.p=0;t.w=0;t.d=0;t.l=0;t.pts=0;});
  currentDay=0;
  render();
}

render();
</script>
</body>
</html>
