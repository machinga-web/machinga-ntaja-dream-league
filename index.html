<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VICTOR EDWARD CHAT 👑</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#111b21;font-family:Arial;height:100vh;display:flex;flex-direction:column}
.top{background:#000;padding:12px;display:flex;align-items:center;gap:12px;color:#fff;border-bottom:3px solid #FFD60A}
.top .logo{width:45px;height:45px;border-radius:50%;background:#FFD60A;display:flex;align-items:center;justify-content:center;font-size:24px;border:2px solid #FFD60A}
.top h2{font-size:17px;color:#FFD60A} .top p{font-size:11px;color:#8696a0}
.login{flex:1;background:#0a0a0a;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:20px}
.login-box{background:#000;padding:25px;border-radius:15px;width:90%;max-width:350px;text-align:center;border:2px solid #FFD60A;box-shadow:0 0 20px rgba(255,214,10,0.3)}
.login-box h1{color:#FFD60A;margin-bottom:8px;font-size:22px}
.login-box h3{color:#fff;font-size:13px;margin-bottom:15px}
.login-box input{width:100%;padding:14px;border:2px solid #333;border-radius:25px;background:#111;color:#fff;margin:10px 0;text-align:center;font-size:15px}
.btn{background:#FFD60A;color:#000;border:none;padding:14px;width:100%;border-radius:25px;font-weight:bold;cursor:pointer;margin-top:10px;font-size:16px}
.chat{display:none;flex:1;flex-direction:column}
.msgs{flex:1;overflow-y:auto;padding:12px;background:#0b141a;background-image:url('https://user-images.githubusercontent.com/15075759/28719144-86dc0f70-73b1-11e7-911d-60d70fcded21.png')}
.bubble{max-width:78%;padding:9px 12px;border-radius:12px;margin:7px 0;position:relative;word-wrap:break-word;font-size:14px;line-height:18px;box-shadow:0 1px 1px rgba(0,0,0,0.4)}
.bubble.other{background:#202c33;color:#e9edef;align-self:flex-start;border-top-left-radius:0;border:1px solid #333}
.bubble.me{background:#FFD60A;color:#000;align-self:flex-end;margin-left:auto;border-top-right-radius:0;font-weight:500}
.bubble .name{color:#FFD60A;font-size:11px;font-weight:bold;margin-bottom:3px}
.bubble.me .name{color:#000}
.bubble .time{font-size:10px;color:#555;float:right;margin-left:10px;margin-top:6px}
.bubble.other .time{color:#8696a0}
.input-bar{background:#000;padding:10px;display:flex;align-items:center;gap:8px;border-top:2px solid #FFD60A}
.input-bar input{flex:1;padding:13px 16px;border-radius:25px;border:2px solid #333;background:#111;color:#fff;font-size:15px}
.send{background:#FFD60A;width:48px;height:48px;border-radius:50%;border:none;color:#000;font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-weight:bold}
</style>
</head>
<body>

<div class="top">
<div class="logo">👑</div>
<div>
<h2>VICTOR EDWARD CHAT 👑</h2>
<p>MACHINGA NTAJA - WhatsApp Yanu Yaulere 💛</p>
</div>
</div>

<div id="login" class="login">
<div class="login-box">
<h1>👑 VICTOR EDWARD CHAT</h1>
<h3>Machinga Ntaja Dream League</h3>
<p style="color:#888;font-size:12px;margin-bottom:10px">WhatsApp Yanu - Yaulere - Data Yochepa!</p>
<input id="userName" placeholder="Dzina Lanu - VICTOR EDWARD" maxlength="25">
<button class="btn" onclick="joinChat()">💛 LOWANI MU CHAT</button>
<p style="color:#555;font-size:10px;margin-top:12px">🔒 Yotetezeka | ⚡ 1KB pa uthenga | 🌍 Kutali</p>
</div>
</div>

<div id="chat" class="chat">
<div class="msgs" id="msgs"></div>
<div class="input-bar">
<input id="msgIn" placeholder="Lembani uthenga BOSS..." onkeypress="if(event.key==='Enter')sendMsg()">
<button class="send" onclick="sendMsg()">➤</button>
</div>
</div>

<script>
let myName="", topic="victor-edward-chat-mndl-2026-official", lastId="";

function joinChat(){
 let n=document.getElementById('userName').value.trim();
 if(!n){alert("Lowetsani Dzina BOSS VICTOR!");return;}
 myName=n;
 document.getElementById('login').style.display='none';
 document.getElementById('chat').style.display='flex';
 addMsg("VICTOR EDWARD BOT","Takulandirani BOSS "+myName+"! 👑 VICTOR EDWARD CHAT yayamba! Tsopano mutha kucheza ndi anzanu a Machinga-Ntaja kutali kulikonse! 💛",false);
 listen();
 setInterval(listen,2500);
}

function addMsg(name,text,isMeCheck=true){
 let box=document.getElementById('msgs');
 let div=document.createElement('div');
 let isMe=isMeCheck && name===myName;
 let cls=isMe?'me':'other';
 let time=new Date().toLocaleTimeString().slice(0,5);
 let showName=!isMe && name!=="VICTOR EDWARD BOT";
 div.className='bubble '+cls;
 div.innerHTML=`${showName?`<div class="name">${name}</div>`:''}${name==="VICTOR EDWARD BOT"?`<div class="name" style="color:#FFD60A">👑 ${name}</div>`:''}<span>${text}</span><span class="time">${time} ✓✓</span>`;
 box.appendChild(div);
 box.scrollTop=999999;
}

async function sendMsg(){
 let inp=document.getElementById('msgIn');
 let txt=inp.value.trim();
 if(!txt) return;
 try{
  await fetch(`https://ntfy.sh/${topic}`,{method:'POST',body:JSON.stringify({name:myName,text:txt}),headers:{Title:"VICTOR EDWARD CHAT"}});
  addMsg(myName,txt);
  inp.value="";
 }catch(e){
  addMsg(myName,txt+" (yosungidwa)",true);
  inp.value="";
 }
}

async function listen(){
 try{
  let r=await fetch(`https://ntfy.sh/${topic}/json?poll=1`);
  let t=await r.text();
  let lines=t.split('\n').filter(l=>l.trim());
  for(let l of lines){
   try{
    let j=JSON.parse(l);
    if(!j.message) continue;
    if(j.id===lastId) continue;
    let inner=JSON.parse(j.message);
    if(inner.name===myName) continue;
    lastId=j.id;
    addMsg(inner.name,inner.text,true);
   }catch(e){}
  }
 }catch(e){}
}
</script>
</body>
</html>
