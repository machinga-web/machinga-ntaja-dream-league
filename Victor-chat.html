<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VICTOR EDWARD CHAT</title>
<style>*{margin:0;padding:0;box-sizing:border-box}body{background:#111;height:100vh;display:flex;flex-direction:column;font-family:Arial}.top{background:#000;padding:12px;display:flex;justify-content:space-between;align-items:center;border-bottom:3px solid #FFD60A}.logo{width:40px;height:40px;background:#FFD60A;border-radius:50%;display:flex;align-items:center;justify-content:center}.count{background:#FFD60A;color:#000;padding:5px 12px;border-radius:20px;font-weight:bold;font-size:12px}.login{flex:1;display:flex;justify-content:center;align-items:center;padding:20px}.box{background:#000;border:2px solid #FFD60A;padding:25px;border-radius:15px;width:90%;max-width:340px;text-align:center}.box h1{color:#FFD60A;font-size:20px}.box input{width:100%;padding:14px;border-radius:25px;border:2px solid #333;background:#111;color:#fff;margin:10px 0;text-align:center}.btn{background:#FFD60A;color:#000;border:none;padding:14px;width:100%;border-radius:25px;font-weight:bold}.chat{display:none;flex:1;flex-direction:column}.online{background:#000;padding:8px;color:#FFD60A;font-size:12px;border-bottom:1px solid #333;max-height:80px;overflow:auto}.msgs{flex:1;overflow:auto;padding:10px;background:#0b141a}.bubble{max-width:75%;padding:8px 12px;border-radius:12px;margin:6px 0;font-size:14px}.other{background:#202c33;color:#fff}.me{background:#FFD60A;color:#000;margin-left:auto}.bar{background:#000;padding:10px;display:flex;gap:8px;border-top:2px solid #FFD60A}.bar input{flex:1;padding:12px;border-radius:25px;border:2px solid #333;background:#111;color:#fff}.send{background:#FFD60A;width:45px;height:45px;border-radius:50%;border:none}</style>
</head><body>
<div class="top"><div style="display:flex;gap:10px;align-items:center"><div class="logo">👑</div><div><h2 style="color:#FFD60A;font-size:14px">VICTOR EDWARD CHAT</h2><p style="color:#888;font-size:10px">Machinga Ntaja</p></div></div><div class="count" id="count">👥 1 Pa Chat</div></div>
<div id="login" class="login"><div class="box"><h1>👑 VICTOR EDWARD CHAT</h1><input id="userName" placeholder="Dzina Lanu"><button class="btn" onclick="joinChat()">LOWANI</button><p style="color:#888;font-size:11px;margin-top:10px">Mudzawoneka ndi anthu ena pa Chat</p></div></div>
<div id="chat" class="chat"><div class="online" id="onlineList">👥 Anthu Pa Chat: Mukudikirira...</div><div class="msgs" id="msgs"></div><div class="bar"><input id="msgIn" placeholder="Lembani..."><button class="send" onclick="sendMsg()">➤</button></div></div>
<script>
let myName="",topic="victor-edward-chat-2026",presenceTopic="victor-edward-presence-2026",lastId="",onlineUsers={};
function joinChat(){let n=userName.value.trim();if(!n)return alert("Dzina!");myName=n;login.style.display='none';chat.style.display='flex';addMsg("BOT","Takulandirani BOSS "+myName+"! Anthu ena akukuonani tsopano!");listen();setInterval(listen,2500);setInterval(sendPresence,8000);setInterval(updateOnlineDisplay,3000);sendPresence();}
function addMsg(n,t){let b=msgs;let d=document.createElement('div');d.className='bubble '+(n===myName?'me':'other');d.innerHTML=(n!==myName?'<b style=color:#FFD60A;font-size:11px>'+n+'</b><br>':'')+t;b.appendChild(d);b.scrollTop=9999}
async function sendMsg(){let v=msgIn.value.trim();if(!v)return;await fetch('https://ntfy.sh/'+topic,{method:'POST',body:JSON.stringify({name:myName,text:v})});addMsg(myName,v);msgIn.value=""}
async function sendPresence(){try{await fetch('https://ntfy.sh/'+presenceTopic,{method:'POST',body:JSON.stringify({name:myName,time:Date.now()})})}catch(e){}}
async function listen(){try{let r=await fetch('https://ntfy.sh/'+topic+'/json?poll=1');let t=await r.text();for(let l of t.split('\n')){try{let j=JSON.parse(l);if(!j.message)continue;if(j.id===lastId)continue;let inn=JSON.parse(j.message);if(inn.name===myName)continue;lastId=j.id;addMsg(inn.name,inn.text)}catch(e){}}let rp=await fetch('https://ntfy.sh/'+presenceTopic+'/json?poll=1');let tp=await rp.text();for(let l of tp.split('\n')){try{let j=JSON.parse(l);if(!j.message)continue;let inn=JSON.parse(j.message);if(Date.now()-inn.time<40000){onlineUsers[inn.name]=inn.time}}catch(e){}}}catch(e){}}
function updateOnlineDisplay(){let now=Date.now();let active=[];for(let name in onlineUsers){if(now-onlineUsers[name]<40000){active.push(name)}else{delete onlineUsers[name]}}if(!onlineUsers[myName])onlineUsers[myName]=now;if(!active.includes(myName))active.push(myName);let unique=[...new Set(active)];document.getElementById('count').innerText='👥 '+unique.length+' Pa Chat';document.getElementById('onlineList').innerHTML='👥 Anthu Pa Chat ('+unique.length+'): '+unique.join(', ');}
</script></body></html>
